name: Test login fails when JIRA_API_TOKEN is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean config
        run: rm -rf "$HOME/.jira.d" "$HOME/jira"
      - id: action
        uses: .
        continue-on-error: true
        env:
          JIRA_BASE_URL: http://127.0.0.1:18082
          JIRA_USER_EMAIL: user@example.com
      - name: Assert action failed and wrote no config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"; exit 1
          fi
          if [ -f "$HOME/.jira.d/credentials" ] || [ -f "$HOME/jira/config.yml" ]; then
            echo "FAIL: config written despite missing token"; exit 1
          fi
          echo "PASS"
