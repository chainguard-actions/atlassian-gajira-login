name: Test login fails on 401 from Jira
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Jira server returning 401
        run: |
          rm -f /tmp/mock-jira-401.log /tmp/mock-jira-401.log.ready
          rm -rf "$HOME/.jira.d" "$HOME/jira"
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/mock-jira.js" 18081 401 /tmp/mock-jira-401.log > /tmp/mock-jira-401.out 2>&1 &
          for i in $(seq 1 50); do
            [ -f /tmp/mock-jira-401.log.ready ] && break
            sleep 0.2
          done
          if [ ! -f /tmp/mock-jira-401.log.ready ]; then
            echo "FAIL: mock server did not start"; cat /tmp/mock-jira-401.out; exit 1
          fi
      - id: action
        uses: .
        continue-on-error: true
        env:
          JIRA_BASE_URL: http://127.0.0.1:18081
          JIRA_USER_EMAIL: user@example.com
          JIRA_API_TOKEN: wrong-token
      - name: Assert action failed and wrote no config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/mock-jira-401.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"; exit 1
          fi
          if ! grep -q '/rest/api/2/myself' /tmp/mock-jira-401.log; then
            echo "FAIL: action did not contact Jira"; exit 1
          fi
          if [ -f "$HOME/.jira.d/credentials" ] || [ -f "$HOME/jira/config.yml" ]; then
            echo "FAIL: config written despite failed login"; exit 1
          fi
          echo "PASS"
